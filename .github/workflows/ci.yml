name: Pruebas automaticas

on:
  push:
    branches:
      - main
      - development
      - feature-tests
      - feature-code
      - impl-fibonacci
      - impl-pin

  pull_request:
    branches:
      - feature-code
      - development
      - main

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test